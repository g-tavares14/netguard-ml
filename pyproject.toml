[project]
name = "netguard-ml"
version = "0.1.0"
description = "Detecção de ataques em redes com Machine Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.44.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "pytest>=8",
    "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netguard_ml"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
